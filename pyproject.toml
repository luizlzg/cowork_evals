[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cowork-evals"
version = "0.1.0"
description = "Run evals for Claude CoWork skills and plugins"
requires-python = ">=3.14"
dependencies = ["PyYAML>=6", "packaging>=24", "python-dotenv>=1"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-timeout>=2.3",
  "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Unit tests are the default selection. Integration tests need a real CoWork profile or a
# real CoWork run, so they are deselected. Run them with: scripts/test.sh -m integration
# tests/unit and tests/integration both hold a test_cowork.py. importlib import mode
# keeps the two basenames distinct without an __init__.py in either directory.
addopts = "-q --strict-markers --import-mode=importlib -m 'not integration'"
markers = [
  "integration: needs a real CoWork profile or a real CoWork run",
  "live: submits a real run. A CoWork run costs a VM boot and leaves a session, and an eval run costs the model calls its case makes",
]
timeout = 300

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# probe.py runs on the container's 3.10 interpreter, not on this package's 3.14. The UP
# rules rewrite to the target version, and py314 syntax does not parse there. The
# formatter rewrites to it as well, so that file is excluded from it below.
# See docs/library.md.
"src/cowork_evals/docker/probe.py" = ["UP"]

[tool.ruff.format]
exclude = ["src/cowork_evals/docker/probe.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/cowork_evals"]
