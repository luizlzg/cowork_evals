[project]
name = "cowork-evals"
version = "0.1.0"
description = "Run evals for Claude CoWork skills and plugins"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-timeout>=2.3",
  "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
timeout = 300

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
package = false
