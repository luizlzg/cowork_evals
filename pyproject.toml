[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cowork-evals"
version = "0.1.0"
description = "Run evals for Claude CoWork skills and plugins"
requires-python = ">=3.14"
dependencies = ["PyYAML>=6"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-timeout>=2.3",
  "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live marker fires a real CoWork session, so it is deselected by default.
# Run it with: scripts/test.sh -m live
addopts = "-q --strict-markers -m 'not live'"
markers = ["live: submits a real CoWork run. Costs a VM boot and leaves a session"]
timeout = 300

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.hatch.build.targets.wheel]
packages = ["src/cowork_evals"]
